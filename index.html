<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha Vida — Atividade</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef3f9;font-family:Arial,sans-serif;color:#183d65}.wrap{max-width:720px;margin:auto;padding:12px}h1{text-align:center;font-size:22px;margin:12px 0}.hint{text-align:center;font-size:13px;margin-bottom:16px}.board{background:white;padding:16px;border-radius:18px;box-shadow:0 2px 15px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.area{border:2px solid #3983b9;border-radius:12px;padding:10px;min-width:0}.area h2{margin:0 0 8px;text-align:center;font-size:15px;color:#145c97}.area textarea{display:block;width:100%;min-height:39px;margin:7px 0;border:0;border-bottom:2px solid #8ac0e8;background:#eaf5ff;border-radius:5px;resize:vertical;padding:7px;font:14px Arial;color:#183d65}.center{margin:13px auto;border-radius:50%;background:#1873b5;color:white;width:105px;height:105px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:bold;border:7px solid #b9def5}.note{text-align:center;font-size:12px;color:#47677e}@media(max-width:390px){.wrap{padding:5px}.board{padding:7px}.grid{gap:5px}.area{padding:5px}.area h2{font-size:12px}.area textarea{font-size:12px;padding:4px;min-height:36px}.center{width:75px;height:75px;font-size:18px;margin:8px auto}}
</style></head><body><main class="wrap"><h1>Minha Vida</h1><p class="hint">Toque nos espaços para escrever. Ao terminar, tire um print da tela.</p><div class="board"><div class="grid" id="top"></div><div class="center">VIDA</div><div class="grid" id="bottom"></div></div><p class="note">As respostas ficam somente nesta página e não são enviadas.</p></main><script>
const sections=[["Igreja","top"],["Lar","top"],["Sociedade","bottom"],["Escola / Trabalho","bottom"]];sections.forEach(([name,target])=>{let box=document.createElement("section");box.className="area";let title=document.createElement("h2");title.textContent=name;box.append(title);for(let i=0;i<4;i++){let field=document.createElement("textarea");field.rows=1;field.setAttribute("aria-label",name+" - espaço "+(i+1));field.placeholder="Escreva aqui";box.append(field)}document.getElementById(target).append(box)});
</script></body></html>
